name: Deploy to OVH

# Every push to main is built in CI first; only a green build is allowed to
# touch production. Manual runs are available from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same box.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node_modules is ~1.1G and takes ~75s to install from scratch, mostly
      # compiling better-sqlite3. The lockfile is the only thing that can change
      # it, so key on the lockfile and restore the tree wholesale.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # postinstall only runs as part of `npm ci`, so on a cache hit the Prisma
      # client is missing. Regenerating is a few seconds and also covers a
      # schema change that left the lockfile untouched.
      - name: Generate Prisma client
        run: npx prisma generate

      # Turbopack's build cache. Keyed on the commit so each run writes its own
      # entry; restore-keys fall back to the newest cache for the same lockfile.
      - name: Restore Turbopack build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  deploy:
    name: Ship to production
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete is required: a file removed in a commit would otherwise linger
      # on the box and break the build. dev.db is the authoritative production
      # database and must never be overwritten from the repo.
      # Excluding .next also preserves .next/cache, which is the Turbopack build
      # cache the next build reuses — do not narrow that exclude to .next/static.
      - name: Sync source
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" \
            --rsync-path="sudo rsync" \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '.next' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'dev.db' --exclude 'dev.db-wal' --exclude 'dev.db-shm' \
            --exclude 'dev.db.bak*' --exclude 'prisma/dev.db' \
            --exclude 'src/generated' --exclude 'tsconfig.tsbuildinfo' \
            ./ "$TARGET:$APP_PATH/"

      # The build must fail loudly — never pipe `npm run build`, a pipe masks the
      # non-zero exit and you restart onto a broken build.
      - name: Migrate, build and restart
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVICE: ${{ secrets.DEPLOY_SERVICE }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$TARGET" bash -s <<REMOTE
          set -euo pipefail
          cd "$APP_PATH"
          # write the log to \$HOME — /tmp is root-owned on this box and the
          # redirect is opened by the unprivileged shell before sudo runs
          LOG=\$HOME/ssbuild.log

          sudo cp dev.db "dev.db.bak-\$(date +%Y%m%d-%H%M%S)"
          ls -t dev.db.bak-* 2>/dev/null | tail -n +11 | xargs -r sudo rm --

          sudo DATABASE_URL="file:./dev.db" npx prisma migrate deploy

          # node_modules is ~1.1G and node_modules/ is never rsynced, so it
          # survives between deploys. Reinstalling it costs about a minute and
          # only the lockfile can invalidate it — so install only when the
          # lockfile actually moved, tracked by a stamp outside the app dir
          # (anything inside it would be swept by rsync --delete).
          STAMP=\$HOME/.ssfact-npm-lock
          LOCKHASH=\$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ -d node_modules ] && [ "\$(cat "\$STAMP" 2>/dev/null)" = "\$LOCKHASH" ]; then
            echo "DEPS UNCHANGED — skipping npm ci"
          else
            echo "DEPS CHANGED — running npm ci"
            sudo npm ci
            echo "\$LOCKHASH" > "\$STAMP"
          fi

          # npm ci's postinstall is what normally generates the Prisma client
          # into src/generated (gitignored, never rsynced). Run it explicitly so
          # a skipped install — or a schema change with no lockfile change —
          # still leaves the client in step with the schema.
          sudo npx prisma generate

          if sudo NODE_OPTIONS=--max-old-space-size=2048 npm run build > "\$LOG" 2>&1; then
            echo "BUILD OK"
          else
            echo "BUILD FAILED"; tail -40 "\$LOG"; exit 1
          fi

          sudo systemctl restart "$SERVICE"
          REMOTE

      - name: Health check
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$TARGET" bash -s <<REMOTE
          set -e
          for i in \$(seq 1 12); do
            code=\$(curl -s -o /dev/null -w '%{http_code}' "localhost:$PORT/login" || true)
            if [ "\$code" = "200" ]; then
              echo "healthy after \${i}s (login \$code)"
              systemctl is-active "$SERVICE"
              exit 0
            fi
            sleep 1
          done
          echo "UNHEALTHY — last code \$code"
          sudo journalctl -u "$SERVICE" -n 40 --no-pager
          exit 1
          REMOTE
